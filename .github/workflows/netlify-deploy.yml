# Continuous deployment for the Ventura Yachts middleware.
#
# Why this exists: the Netlify site is not connected to this repository. Its
# build settings are empty, so merging to `main` used to deploy nothing and
# every release was a manual `netlify deploy` from someone's laptop — which is
# how the immersive-tours change sat merged-but-not-live on 7 Sep 2026.
#
# A native Git connection is not currently possible: deploy keys are disabled
# by org policy on South-Digital, and Netlify's GitHub App is not installed on
# the org. This workflow needs neither — it deploys with the Netlify CLI.
#
# Required once, by someone who can mint the credential:
#   Settings > Secrets and variables > Actions > New repository secret
#     NETLIFY_AUTH_TOKEN = a Netlify personal access token with access to the
#                          venturayachts site
# Prefer a token scoped to a shared/South-owned Netlify account over a personal
# one, so CD does not depend on a single person's login.

name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: 21818f46-cd31-4e6f-a8ad-8fa73150efed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Functions are bundled by Netlify, but their dependencies must be present.
      - run: npm ci

      # `secrets` is not dependable inside a step-level `if`, so test the value.
      - name: Fail early if the deploy credential is missing
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          # Passed as env, never interpolated into the command: a branch name,
          # PR title or commit message is attacker-controllable text.
          DEPLOY_MESSAGE: >-
            ${{ github.event_name == 'pull_request'
                && format('PR #{0}: {1}', github.event.number, github.event.pull_request.title)
                || format('{0} ({1})', github.event.head_commit.message, github.sha) }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Draft deploy: a preview URL, production untouched.
            npx netlify-cli@latest deploy \
              --site "$NETLIFY_SITE_ID" \
              --functions netlify/functions \
              --message "$DEPLOY_MESSAGE" \
              | tee deploy.log
          else
            npx netlify-cli@latest deploy --prod \
              --site "$NETLIFY_SITE_ID" \
              --functions netlify/functions \
              --message "$DEPLOY_MESSAGE" \
              | tee deploy.log
          fi

      # The feed is the whole point of this site, so prove it still answers
      # before calling the deploy good.
      - name: Smoke-test the deployed feed
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]*venturayachts\.netlify\.app' deploy.log | tail -1)
          [ -n "$URL" ] || { echo "::error::could not read a deploy URL"; exit 1; }
          echo "Testing $URL"
          # First call after a schema bump rebuilds the blob cache, so allow retries.
          for i in 1 2 3 4 5 6; do
            body=$(curl -s --max-time 60 "$URL/.netlify/functions/boats?id=10041167") && \
            echo "$body" | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const b=(JSON.parse(s).data)||{};
                if(!b.boat_id) throw new Error("no boat in payload");
                console.log("boat_id",b.boat_id,"| tours",(b.tours||[]).length,"| videos",(b.videos||[]).length);
              })' && exit 0
            echo "attempt $i failed, retrying…"; sleep 15
          done
          echo "::error::feed did not respond correctly after deploy"; exit 1

      # /img is a separate failure domain from the feed and was not covered here.
      # It depends on sharp's native binary, which is copied out of node_modules
      # rather than bundled and therefore tracks the machine that built the
      # deploy. A darwin-only binary blacked out every brokerage photo between
      # 7 and 9 Sep 2026 while the feed stayed perfectly healthy, so this job
      # went green throughout.
      #
      # Assert a real transform, not merely a 200: img.mjs deliberately falls
      # back to a 302 to the full-size original when sharp cannot load, so a
      # degraded deploy still serves images and would otherwise pass silently.
      - name: Smoke-test the image proxy
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]*venturayachts\.netlify\.app' deploy.log | tail -1)
          [ -n "$URL" ] || { echo "::error::could not read a deploy URL"; exit 1; }
          IMG=$(curl -s --max-time 60 "$URL/.netlify/functions/boats?id=10041167" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const b=(JSON.parse(s).data)||{};
              const u=(b.image||[])[0];
              if(!u){console.error("no image in payload");process.exit(1);}
              console.log(u);
            })')
          [ -n "$IMG" ] || { echo "::error::no upstream image to test with"; exit 1; }
          ENC=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$IMG")
          CT=$(curl -s -o /dev/null -w '%{content_type}' --max-time 60 "$URL/img?url=$ENC&w=640&q=75")
          echo "/img returned content-type: $CT"
          case "$CT" in
            image/webp) echo "image proxy transformed correctly" ;;
            *) echo "::error::/img did not transform (got '$CT'). sharp probably failed to load - check @img/sharp-linux-x64 is in the deployed bundle."; exit 1 ;;
          esac
