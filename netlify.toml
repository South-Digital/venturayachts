# The publish directory is deliberately NOT the repo root. It used to be, which
# meant every file in the repo was served from the site: package.json, the README,
# the stale framer/ copy, and every function source under netlify/functions —
# including _boats/shared.js and the API keys hardcoded in it. Only public/ is
# public now; functions are still bundled from the directory below.
[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[[redirects]]
  from = "/boats/related/*"
  to = "/.netlify/functions/related-boats?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/boats/related"
  to = "/.netlify/functions/related-boats"
  status = 200
  force = true

[[redirects]]
  from = "/boats/refresh"
  to = "/.netlify/functions/boats-refresh"
  status = 200
  force = true

[[redirects]]
  from = "/boats/*"
  to = "/.netlify/functions/boats?id=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/boats"
  to = "/.netlify/functions/boats"
  status = 200
  force = true

[[redirects]]
  from = "/brands"
  to = "/.netlify/functions/brands"
  status = 200
  force = true

[[redirects]]
  from = "/boatscom-raw"
  to = "/.netlify/functions/boatscom-raw"
  status = 200
  force = true

[[redirects]]
  from = "/boatwizard-raw"
  to = "/.netlify/functions/boatwizard-raw"
  status = 200
  force = true
